name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0f8f78&color_dots=#ebedf0,#a8eadd,#5fd6bf,#1dc7a5,#0f8f78
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1dc7a5&color_dots=#161b22,#0f3d3a,#13685c,#16a088,#1dc7a5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
